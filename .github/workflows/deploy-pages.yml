name: Deploy OneJobKits tools to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Stage the public site files
        run: |
          mkdir -p _site/tools/drawdown-calculator
          cp index.html _site/index.html
          cp tools/drawdown-calculator/index.html _site/tools/drawdown-calculator/index.html
          cp sitemap.xml _site/sitemap.xml
          cp robots.txt _site/robots.txt
          cp google2b6737130bb8aa62.html _site/google2b6737130bb8aa62.html
          cp -r products _site/products
          cp -r digistore24 _site/digistore24
          cp -r legal-information _site/legal-information
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
